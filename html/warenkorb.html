  <head>

  <body>
    <div class="container">
      <nav>
        <div class="nav">
          <a href="/html/index.html"><img class="logo" src="/Bilder/cantonili-logo.webp" alt="Logo"></a>
          <a href="/html/team.html">Team</a>
          <a href="/html/warenkorb.html">Warenkorb</a>
        </div>
      </nav>

      <main>
<form action="https://blj-ict-bz.ch/formlog/" method="post">
    <fieldset>
        <legend>Personalien</legend>

        <label for="fname">Vorname:</label>
        <input type="text" id="fname" name="Vorname" placeholder="Vorname" required>

        <label for="lname">Nachname:</label>
        <input type="text" id="lname" name="Nachname" placeholder="Nachname" required>

        <br><br>

        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="E-Mail" placeholder="Deine E-Mail" required>

        <br><br>

        <label for="street">Strasse:</label>
        <input type="text" id="street" name="Strasse" placeholder="Deine Strasse" required>

        <br><br>

        <label for="birthday">Geburtstag:</label>
        <input type="date" id="birthday" name="birthday">

        <br><br>

        <label for="pullover">Pullover:</label>
        <select id="pullover" name="pullover">
            <optgroup label="Farbe">
                <option value="Sand">Sand</option>
                <option value="Military Green">Military Green</option>
                <option value="Granat">Granat</option>
                <option value="Nein">Nein</option>
            </optgroup>
        </select>

        <label for="t-shirt">T-Shirt:</label>
        <select id="t-shirt" name="t-shirt">
            <optgroup label="Farbe">
                <option value="Sand">Sand</option>
                <option value="Military Green">Military Green</option>
                <option value="Granat">Granat</option>
                <option value="Nein">Nein</option>
            </optgroup>
        </select>

        <label for="cap">Caps:</label>
        <select id="cap" name="cap">
            <optgroup label="Farbe">
                <option value="Vintage Sand">Sand</option>
                <option value="Vintage Stone">Stone</option>
                <option value="Vintage Olive">Olive</option>
                <option value="Nein">Nein</option>
            </optgroup>
        </select>

        <br><br>

        <input type="submit" value="Absenden">
    </fieldset>
</form>
      </main>
      <footer>
        <a href="/html/terms.html" target="_blank">terms & conditions</a>
        <a href="/html/privacy.html" target="_blank">privacy policy</a>
      </footer>
    </div>
  </body>
</html>
